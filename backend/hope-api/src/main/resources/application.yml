server:
  port: 10003

spring:
  profiles:
    active: '@profileActive@'
  main:
    allow-bean-definition-overriding: true
  application:
    name: hope-biz-api
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/xml/*.xml
  type-aliases-package: org.hopeframework.biz.api.model
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# Swagger 文档配置
swagger:
  title: Hope Framework API
  description: Spring Boot 后端服务脚手架
  url: http://localhost:10003/

logging:
  config: classpath:logback-spring.xml

community:
  id: ${COMMUNITY_ID:1}
  code: '${COMMUNITY_CODE:default}'
  name: '${COMMUNITY_NAME:开源社区}'
  logo-url: '${COMMUNITY_LOGO_URL:}'
  default-avatar-url: '${COMMUNITY_DEFAULT_AVATAR_URL:https://itzxiu.oss-cn-chengdu.aliyuncs.com/images/2026/08/12/3abaa404cc3a4adaab49318f0645d146.png}'
  security:
    access-token-secret: '${COMMUNITY_ACCESS_TOKEN_SECRET:dev-only-change-this-access-token-secret}'
    access-token-seconds: ${COMMUNITY_ACCESS_TOKEN_SECONDS:7200}
