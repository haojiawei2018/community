# 生产环境配置：所有连接信息通过环境变量传入
spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: '${DB_URL}'
          username: '${DB_USERNAME}'
          password: '${DB_PASSWORD}'
  redis:
    host: '${REDIS_HOST:localhost}'
    port: ${REDIS_PORT:6379}
    password: '${REDIS_PASSWORD:}'
    database: ${REDIS_DATABASE:0}

aliyun:
  oss:
    endpoint: '${ALIYUN_OSS_ENDPOINT}'
    access-key-id: '${ALIYUN_OSS_ACCESS_KEY_ID}'
    access-key-secret: '${ALIYUN_OSS_ACCESS_KEY_SECRET}'
    bucket-name: '${ALIYUN_OSS_BUCKET_NAME}'
    public-domain: '${ALIYUN_OSS_PUBLIC_DOMAIN:}'
    object-prefix: '${ALIYUN_OSS_OBJECT_PREFIX:images}'
    max-image-size: '${ALIYUN_OSS_MAX_IMAGE_SIZE:10MB}'

logging:
  level:
    org.hopeframework.biz.api: info
