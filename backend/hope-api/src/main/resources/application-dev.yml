# 开发环境配置：默认连接本机 MySQL / Redis，按需修改
spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/hope?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
          username: root
          password: root
        # 多数据源示例：新增数据源时在此追加配置，并在 Service/Mapper 上使用 @DS("数据源名")
        # slave:
        #   driver-class-name: com.mysql.cj.jdbc.Driver
        #   url: jdbc:mysql://localhost:3306/hope_slave?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
        #   username: root
        #   password: root
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

logging:
  level:
    org.hopeframework.biz.api: debug